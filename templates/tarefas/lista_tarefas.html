{% extends 'base.html' %}

{% block content %}

    <div class="card shadow-sm mb-4">
        <div class="card-body">
            <h3 class="card-title">Adicionar Nova Tarefa</h3>
            
            <form action="{% url 'criar_tarefa' %}" method="POST">
                {% csrf_token %}
                <div class="input-group">
                    <input type="text" name="titulo" class="form-control" placeholder="O que precisa ser feito?" required>
                    <button type="submit" class="btn btn-primary">Adicionar</button>
                </div>
            </form>
        </div>
    </div>

    <div class="card shadow-sm">
        <div class="card-body">
            <h3 class="card-title">Minhas Tarefas Pendentes</h3>
            
            <ul class="list-group list-group-flush">
                
                {% for tarefa in tarefas %}
                    <li class="list-group-item d-flex justify-content-between align-items-center">
                        {{ tarefa.titulo }}
                        
                        <div>
                            <a href="{% url 'concluir_tarefa' tarefa.id %}" class="btn btn-sm btn-success">Concluir</a>
                            <a href="{% url 'editar_tarefa' tarefa.id %}" class="btn btn-sm btn-info">Editar</a> 
                            <a href="{% url 'excluir_tarefa' tarefa.id %}" class="btn btn-sm btn-danger">Excluir</a>
                        </div>
                    </li>
                {% empty %}
                    <li class="list-group-item text-muted">
                        Você não tem tarefas pendentes.
                    </li>
                {% endfor %}
            </ul>
        </div>
    </div>

{% endblock %}
